<!doctype html>
< lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00a8ff">


    <title>Gallery | Tilak Varma Fan Club</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/gallery.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <img src="image/tilak.png" />

          <span>Tilak Varma Fan Club</span>
        </div>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>

          <li><a href="stats.html">Stats</a></li>

          <li><a href="news.html">News</a></li>

          <li><a href="gallery.html" class="active">Gallery</a></li>

          <li><a href="career.html">Career</a></li>

          <li><a href="records.html">Records</a></li>

          <li><a href="matches.html">Matches</a></li>

          <li><a href="contact.html">Contact</a></li>
        </ul>

        <div class="menu">&#9776;</div>
      </nav>
    </header>

    <section class="gallery-hero">
      <h1>Photo Gallery</h1>

      <p>Latest photos of Tilak Varma</p>
    </section>

    <section class="gallery-page">
      <div class="gallery-grid" id="galleryContainer">
        <!-- Firebase Images -->
      </div>
    </section>
    <div id="lightbox">

    <span id="close">&times;</span>

    <button class="prev-btn" onclick="previousImage()">❮</button>

    <img id="lightbox-img">

    <button class="next-btn" onclick="nextImage()">❯</button>

    <button id="downloadBtn" onclick="downloadImage()">
        ⬇ Download
    </button>

    </div>
    <script>
           const menu = document.querySelector(".menu-toggle");
           const navLinks = document.querySelector(".nav-links");

          if (menu && navLinks) {
           menu.addEventListener("click", () => {
           navLinks.classList.toggle("active");
      });
}
    </script>
    <script type="module" src="js/gallery.js"></script>
  </body>
</html>
