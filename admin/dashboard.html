<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<body>

<div class="admin-container">

    <div class="sidebar">

        <h2>🏏 Admin</h2>

        <ul>

            <li>🏠 Dashboard</li>
            <li onclick="showNews()">📰 News</li>
            <li>🖼 Gallery</li>
            <li>🏏 Matches</li>
            <li>⚙ Settings</li>
            <li>🚪 Logout</li>

        </ul>

    </div>

    <div class="content">

        <div id="dashboardContent">

         <h1>Welcome Admin 👋</h1>

         <p>Manage your Tilak Varma Fan Club website from here.</p>

        </div>


        <div id="newsPanel" style="display:none;">

             <h1>Manage News</h1>

            <input type="text" id="newsTitle" placeholder="News Title">

            <br><br>

          <textarea id="newsDesc" placeholder="News Description"
            style="width:100%;height:150px;"></textarea>

           <br><br>

          <button onclick="addNews()">Publish News</button>

        </div>

        <p>Manage your Tilak Varma Fan Club website from here.</p>

       
    </div>

</div>

</body>

</body>
</html>
