<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->
        <div class="sidebar">

            <h2>🏏 Admin</h2>

            <ul>
                <li onclick="showDashboard()">🏠 Dashboard</li>
                <li onclick="showNews()">📰 News</li>
                <li>🖼 Gallery</li>
                <li>🏏 Matches</li>
                <li>⚙️ Settings</li>
                <li onclick="logout()">🚪 Logout</li>
            </ul>

        </div>

        <!-- Main Content -->
        <div class="content">

            <!-- Dashboard -->
            <div id="dashboardContent">

                <h1>Welcome Admin 👋</h1>

                <p>Manage your Tilak Varma Fan Club website from here.</p>

            </div>

            <!-- News Panel -->
            <div id="newsPanel" style="display:none;">

                <h1>📰 Manage News</h1>

                <br>

                <input
                    type="text"
                    id="newsTitle"
                    placeholder="News Title"
                    style="width:100%;padding:12px;">

                <br><br>

                <textarea
                    id="newsDesc"
                    placeholder="News Description"
                    style="width:100%;height:180px;padding:12px;"></textarea>

                <br><br>

                <label><b>📷 Upload News Image</b></label>

                <br><br>

                <input
                    type="file"
                    id="newsImage"
                    accept="image/*">

                <br><br>

                <button onclick="addNews()">
                    🚀 Publish News
                </button>

            </div>

        </div>

    </div>

    <script type="module" src="admin.js"></script>

</body>

</html>
